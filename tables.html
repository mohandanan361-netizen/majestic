<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هندسة وتصميم الأسقف | Majestic Aura</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة Swiper للحركة -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="style.css">
    
    <!-- ستايل إضافي مخصوص للصفحة دي عشان تظبط على الموبايل واللاب -->
    <style>
        .swiper-slide {
            width: 320px; /* عرض الصورة على اللاب */
            height: 480px; 
            border-radius: 20px; /* حواف ناعمة جداً */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        @media (max-width: 768px) {
            .swiper-slide {
                width: 260px; /* عرض الصورة على الموبايل */
                height: 380px;
            }
        }
    </style>
</head>
<body>

    <!-- الهيدر الداخلي -->
    <header class="inner-header">
        <a href="index.html" class="back-btn">&rarr; عودة للرئيسية</a>
        <h1 class="page-title">هندسة الطاولات والمقاعد</h1>
    </header>

    <!-- المعرض الدائري -->
    <section class="gallery-section">
        <div class="swiper mySwiper">
            <div class="swiper-wrapper">
                
                <div class="swiper-slide">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEg34-hHxXGF6KAs4MnsjhCq8n_lokZvt6HbnNgaJHWrinO-K9qHBjLChgJkgxhGATTUCusHzrqwCzRizUBLvqT7egG8kDqJUQdteZNXZbMYgRcU6SVOSEzfLdw6iyw05JotNLV4BNWNG9weLYxY4wrIDvMbTxVRZwU6qOgMioYRAR5OcY9gJwc9dRq5pjQ3/s1600/WhatsApp%20Image%202026-10-15%20at%206.02.59%20PM.jpeg" alt="سقف 1" onclick="openLightbox(this.src)">
                </div>
                
                <div class="swiper-slide">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjnPXJp5yuKVZv7_AbryzRJFtu1hNHZtN7OYO0pkhx-neAiPenIolCLig62O3gMWDUzhdobDuFvoMy5yrUZoj6CIYzAb47kfP38Xvp3eZDNV07RDizTjEDS1GsYOh9stdrlI_04e57fmb8bEvNLHZ9Bg6sfMs3MYhopRWttGsxJS-wjFvmidcGxV6I7PK0l/s1600/WhatsApp%20Image%202026-10-12%20at%2012.16.45%20PM.jpeg" alt="سقف 2" onclick="openLightbox(this.src)">
                </div>
                
                <div class="swiper-slide">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEju5GdOAZVh0ejqT1V47cVThltCkEyKHJ2wdNR00iv7ziH5HrJV0KoI65q0Tf0_kPP3letE4zu9R3lteOcTwPRTgyYBxma7t0cdR7ysTdQw6FzT4I9b-HLpg5yoJtNsEc0vBEO6njeQmKR-jJHRYVnYE-nviNAeaJ-IURK1TzHpVer3dp0EyHy42FD0n0np/s1600/TABLE%2001.jpeg" alt="سقف 3" onclick="openLightbox(this.src)">
                </div>
                
                <div class="swiper-slide">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhe9qkEyPArWNSZUWNExGtdEskAkGsQu_dY4oBRBvsKw6jL6Fk9VIyzPNqGpLQrpfKBRcai7aTUBkwQUtDI0hyphenhyphenBXGoetwoFfg8e4gPBTcdRH_uQA6G0m9aNj22mv8tVmDH43EPiDVcHJr8za53HKAg1WN_sbzURITzt1RRBA_Z_Nc1RVgXZIbF6DhC616k4/s1600/TABLE%2002.jpeg" alt="سقف 4" onclick="openLightbox(this.src)">
                </div>
                <div class="swiper-slide">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhtUs2AxxGxshOMF6v-P9a4ukDoc6816IXvWcXTa1l7yzRhlUU6_eqVAAxRaaw-idhY05o5iT6hHBZmHfmv8qEYPyJPHIOnNduus6_Rw_mrICFusCnlSIadMYKPAxVNXU8FrmPZSXALKOlT9UWVzssfNj_z_jyFkAkdGcADSONzwdUVD9cGW1Oz2OvzSJX6/s1600/table%2003.jpeg" alt="سقف 4" onclick="openLightbox(this.src)">
                </div>

            </div>
            <!-- النقط السفلية -->
            <div class="swiper-pagination"></div>
        </div>
    </section>

    <!-- البوب أب (Lightbox) -->
    <!-- ضفنا onclick هنا عشان لو العميل داس في أي حتة فاضية يخرج -->
    <div id="imageLightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="close-lightbox">&times;</span>
        <img id="lightboxImage" src="" alt="المعاينة">
    </div>

    <!-- أكواد الجافاسكريبت دمجناها هنا عشان تشتغل 100% -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        // 1. تشغيل المعرض بنظام الساعة السمارت (Flat Coverflow)
        var swiper = new Swiper(".mySwiper", {
            effect: "coverflow",
            grabCursor: true,
            centeredSlides: true,
            slidesPerView: "auto",
            loop: true,
            coverflowEffect: {
                rotate: 0,       // خلينا الزاوية صفر عشان يبقى مسطح وعصري
                stretch: 0,      // المسافة بين الكروت
                depth: 150,      // العمق اللي بيخلي الصور الجانبية تصغر وترجع لورا
                modifier: 2.5,   // قوة التأثير
                slideShadows: true, // ظلال بتدي فخامة
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });

        // 2. تشغيل البوب أب (تكبير الصورة)
        const lightbox = document.getElementById("imageLightbox");
        const lightboxImg = document.getElementById("lightboxImage");

        function openLightbox(imageSrc) {
            lightboxImg.src = imageSrc; // سحب الرابط
            lightbox.classList.add("active"); // إظهار الشاشة
        }

        function closeLightbox(e) {
            // لو العميل داس على الصورة نفسها متقفلش، تقفل بس لو داس على الـ X أو في الفراغ
            if (e.target !== lightboxImg) {
                lightbox.classList.remove("active");
            }
        }
    </script>
</body>
</html>
